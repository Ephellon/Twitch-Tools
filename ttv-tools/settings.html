<!DOCTYPE html>
<html dir=ltr lang=en>
<!-- /settings.html
    #     _____      _   _   _                   _     _             _
    #    / ____|    | | | | (_)                 | |   | |           | |
    #   | (___   ___| |_| |_ _ _ __   __ _ ___  | |__ | |_ _ __ ___ | |
    #    \___ \ / _ \ __| __| | '_ \ / _` / __| | '_ \| __| '_ ` _ \| |
    #    ____) |  __/ |_| |_| | | | | (_| \__ \_| | | | |_| | | | | | |
    #   |_____/ \___|\__|\__|_|_| |_|\__, |___(_)_| |_|\__|_| |_| |_|_|
    #                                 __/ |
    #                                |___/
    -->

<head>
    <title tr-id=title>TTV Tools &mdash; Settings</title>

    <!-- Colors & Meanings
            # Gold      - deals with cosmetics
            # Red       - deals with followage
            # Purple    - deals with currencies
            # White     - everything else

            # Pink      - in beta
            # Blue      - notice this
        -->

    <link rel=icon href='favicon.png' />
    <link rel=stylesheet href='tokens.css' />
    <link rel=stylesheet href='extras.css' />
    <link rel=stylesheet href='settings.css' />

    <meta charset=utf-8 />
</head>

<body>

    <!-- Search
        #     _____                     _
        #    / ____|                   | |
        #   | (___   ___  __ _ _ __ ___| |__
        #    \___ \ / _ \/ _` | '__/ __| '_ \
        #    ____) |  __/ (_| | | | (__| | | |
        #   |_____/ \___|\__,_|_|  \___|_| |_|
        #
        #
        -->
    <div id=search-container data-focus=false>
        <div id=search-results data-empty=true></div>
        <input id=search type=search placeholder='Search for a setting...' autocomplete=off>
    </div>

    <div id=context-id set='content=context.id;style→text-decoration:2px dotted underline #\context.id::int@16?8'></div>

    <button id=save class=ripple></button>
    <button id=help class=ripple set='glyph=Glyphs.utf8.accessible'></button>

    <!-- Renders the settings from src/settings/layout.js (see docs/SETTINGS.md) -->
    <script src='dsl/errors.js'></script>
    <script src='dsl/tokens.js'></script>
    <script src='dsl/tokenizer.js'></script>
    <script src='dsl/ast.js'></script>
    <script src='dsl/parser.js'></script>
    <script src='dsl/runtime.js'></script>
    <script src='dsl/compiler.js'></script>
    <script src='dsl/highlight.js'></script>
    <script src='dsl/index.js'></script>
    <script src='settings-ui.js'></script>
    <script src='ext/localforage.js'></script>
    <script src='ext/polyfill.js'></script>
    <script src='ext/glyphs.js'></script>
    <script src='core.js'></script>
    <script src='settings.js'></script>

    <style>
        /* CSS needs to be here so that `height:100%` and `width:100%` can render properly */
        #context-id {
            color: #9147ff44;
            font-family: monospace;
            font-size: 2rem;
            text-align: center;

            padding: 0 1rem 1rem;
        }

        #context-id::after {
            content: attr(content);
        }

        .popup .ripple:after {
            content: ' ';

            background-color: #fff4;
            border-radius: 10rem;
            display: none;

            height: 100%;
            width: 100%;

            position: absolute;
            left: 0;
            top: 0;
            z-index: 9;
        }

        .popup .ripple:hover:after,
        .ripple.animate:after {
            display: block !important;

            -webkit-transform: scale(0);
            -moz-transform: scale(0);
            -o-transform: scale(0);
            transform: scale(0);

            -webkit-animation: ripple .5s linear;
            -moz-animation: ripple .5s linear;
            -o-animation: ripple .5s linear;
            animation: ripple .5s linear;
        }

        @keyframes ripple {
            100% {
                opacity: 0;

                -webkit-transform: scale(2.5);
                -moz-transform: scale(2.5);
                -o-transform: scale(2.5);
                transform: scale(2.5);
            }
        }

        .spin:before {
            content: ' ' !important;

            background-color: #0000;
            border: 2px solid var(--white-faded) !important;
            border-left-color: var(--white) !important;
            border-radius: 50% !important;

            height: 1.2rem !important;
            width: 1.2rem !important;

            position: absolute;
            left: calc(50% - .725rem) !important;
            top: calc(50% - .725rem) !important;
            z-index: 9;

            -webkit-animation: spin 1s linear infinite;
            -moz-animation: spin 1s linear infinite;
            -o-animation: spin 1s linear infinite;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% {
                -webkit-transform: rotate(0);
                -moz-transform: rotate(0);
                -o-transform: rotate(0);
                transform: rotate(0);
            }

            100% {
                -webkit-transform: rotate(360deg);
                -moz-transform: rotate(360deg);
                -o-transform: rotate(360deg);
                transform: rotate(360deg);
            }
        }

    </style>
</body>

</html>
