name: CI

on:
  push:
    branches: [master]
  pull_request:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: DSL tests
        run: npm test
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build -- --zip
      - name: Lint Firefox build
        run: npx web-ext lint --source-dir dist/firefox
      - uses: actions/upload-artifact@v4
        with:
          name: ttv-tools-${{ github.sha }}
          path: dist/*.zip

  release:
    if: github.event_name == 'release'
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ttv-tools-${{ github.sha }}
      - name: Attach zips to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" ttv-tools.zip ttv-tools-firefox.zip --clobber --repo "${{ github.repository }}"
